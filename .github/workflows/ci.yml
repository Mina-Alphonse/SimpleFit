name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Type-Check
        run: pnpm turbo run type-check

      - name: Turbo Unit & Integration Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres.xtzzdyqykdvptmuvykdw:FLm6-WVzwGJ$j*f@aws-1-eu-central-1.pooler.supabase.com:6543/postgres' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || 'https://upward-sunfish-90650.upstash.io' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || 'gQAAAAAAAWIaAAIgcDE3MDAyNjU4OGY0ZGI0OTFlOTNmZGUzOGYyYWM5YzZkNg' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'development_secret_key_32_bytes_long_simplefit_2026' }}
        run: pnpm turbo run test

      - name: Turbo Production Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres.xtzzdyqykdvptmuvykdw:FLm6-WVzwGJ$j*f@aws-1-eu-central-1.pooler.supabase.com:6543/postgres' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || 'https://upward-sunfish-90650.upstash.io' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || 'gQAAAAAAAWIaAAIgcDE3MDAyNjU4OGY0ZGI0OTFlOTNmZGUzOGYyYWM5YzZkNg' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'development_secret_key_32_bytes_long_simplefit_2026' }}
        run: pnpm turbo run build
